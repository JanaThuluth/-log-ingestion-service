services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: logs_user
      POSTGRES_PASSWORD: logs_password
      POSTGRES_DB: logs_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    cpus: "1.0"
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U logs_user -d logs_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: logs_db
      DB_USER: logs_user
      DB_PASSWORD: logs_password
    depends_on:
      postgres:
        condition: service_healthy
    cpus: "0.5"
    mem_limit: 256m

volumes:
  postgres_data:
